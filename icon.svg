<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- inventory slot background -->
    <radialGradient id="slotGlow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#3a3f8f"/>
      <stop offset="55%" stop-color="#191d38"/>
      <stop offset="100%" stop-color="#0c0e1c"/>
    </radialGradient>
    <linearGradient id="slotBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7bff"/>
      <stop offset="50%" stop-color="#2227be"/>
      <stop offset="100%" stop-color="#0a0c3a"/>
    </linearGradient>

    <!-- magical aura behind the scroll -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#786bff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#2227be" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2227be" stop-opacity="0"/>
    </radialGradient>

    <!-- parchment: cylindrical bulge shading -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#b9975b"/>
      <stop offset="12%" stop-color="#e7cf9c"/>
      <stop offset="50%" stop-color="#f7ecc9"/>
      <stop offset="88%" stop-color="#e2c790"/>
      <stop offset="100%" stop-color="#a9854a"/>
    </linearGradient>
    <!-- aged vignette on the sheet -->
    <radialGradient id="age" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff8e6" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c9a761" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7a5a2a" stop-opacity="0.45"/>
    </radialGradient>

    <!-- wooden rod: cylinder -->
    <linearGradient id="rod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7a4a24"/>
      <stop offset="28%" stop-color="#b9793f"/>
      <stop offset="48%" stop-color="#e6b071"/>
      <stop offset="70%" stop-color="#8a541f"/>
      <stop offset="100%" stop-color="#5a3315"/>
    </linearGradient>
    <radialGradient id="cap" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f4d29a"/>
      <stop offset="55%" stop-color="#c79246"/>
      <stop offset="100%" stop-color="#6f4620"/>
    </radialGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="rune" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9aa6ff"/>
      <stop offset="45%" stop-color="#2227be"/>
      <stop offset="100%" stop-color="#121470"/>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- inventory slot -->
  <rect x="18" y="18" width="476" height="476" rx="52" fill="url(#slotBevel)"/>
  <rect x="27" y="27" width="458" height="458" rx="45" fill="url(#slotGlow)"/>
  <rect x="27" y="27" width="458" height="228" rx="45" fill="#ffffff" opacity="0.05"/>

  <!-- aura -->
  <circle cx="256" cy="262" r="185" fill="url(#aura)"/>

  <!-- sparkles -->
  <g fill="#dfe4ff">
    <path d="M132 120 l6 20 20 6 -20 6 -6 20 -6 -20 -20 -6 20 -6 z" opacity="0.9"/>
    <path d="M392 156 l4 13 13 4 -13 4 -4 13 -4 -13 -13 -4 13 -4 z" opacity="0.75"/>
    <circle cx="378" cy="352" r="4" opacity="0.7"/>
    <circle cx="146" cy="372" r="3" opacity="0.6"/>
  </g>

  <!-- scroll -->
  <g filter="url(#softShadow)">
    <!-- top rolled curl (behind sheet) -->
    <rect x="150" y="96" width="212" height="34" rx="17" fill="url(#rod)"/>
    <ellipse cx="150" cy="113" rx="13" ry="19" fill="url(#cap)"/>
    <ellipse cx="362" cy="113" rx="13" ry="19" fill="url(#cap)"/>

    <!-- parchment sheet -->
    <path d="M158 122
             q98 -14 196 0
             q10 76 0 268
             q-98 14 -196 0
             q-10 -134 0 -268 z" fill="url(#paper)"/>
    <path d="M158 122 q98 -14 196 0 q10 76 0 268 q-98 14 -196 0 q-10 -134 0 -268 z" fill="url(#age)"/>

    <!-- inked lines -->
    <g stroke="#5b4322" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.55">
      <path d="M182 172 q74 -10 148 0"/>
      <path d="M182 200 q74 -9 148 0"/>
      <path d="M182 300 q74 -9 148 0"/>
      <path d="M182 328 q56 -7 112 0"/>
    </g>

    <!-- glowing rune emblem -->
    <g filter="url(#glow)">
      <circle cx="256" cy="256" r="30" fill="url(#rune)"/>
      <path d="M256 238 v36 M240 250 h32 M244 266 l24 -20" stroke="#eaf0ff" stroke-width="4"
            stroke-linecap="round" fill="none"/>
    </g>

    <!-- gloss highlight -->
    <path d="M166 128 q40 -8 78 -6 q-2 130 -6 258 q-30 4 -60 2 q-14 -132 -12 -254 z"
          fill="url(#gloss)" opacity="0.35"/>

    <!-- bottom rolled curl (in front) -->
    <rect x="150" y="382" width="212" height="36" rx="18" fill="url(#rod)"/>
    <path d="M150 384 q106 -18 212 0 l0 8 q-106 -16 -212 0 z" fill="#ffffff" opacity="0.25"/>
    <ellipse cx="150" cy="400" rx="14" ry="20" fill="url(#cap)"/>
    <ellipse cx="362" cy="400" rx="14" ry="20" fill="url(#cap)"/>
  </g>
</svg>
